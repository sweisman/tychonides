name: Verify code and catalog
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            os: ubuntu-24.04
          - python: '3.14'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[dev,analysis]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m unittest discover -s tests
      - run: tychonides --help
      - name: Regenerate the study tables and figures
        run: |
          python examples/mars_1595.py --output "$RUNNER_TEMP/mars-1595"
          python examples/mars_oppositions.py --output "$RUNNER_TEMP/mars-oppositions"
          python examples/refraction_tables.py --output "$RUNNER_TEMP/refraction-tables"
          python examples/planetary_parallax.py --output "$RUNNER_TEMP/parallax"
          python examples/printed_predictions.py --output "$RUNNER_TEMP/printed-predictions"
      - name: Download versioned catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(jq -er '.release_id' resources/catalog/manifest.json)
          while IFS= read -r asset; do
            for attempt in 1 2 3; do
              if gh release download "$release_id" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/tychonides-assets --clobber; then
                break
              fi
              if (( attempt == 3 )); then
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done < <(jq -er '.output_hashes | keys[]' resources/catalog/manifest.json)
      - run: tychonides-verify resources/catalog --assets-dir /tmp/tychonides-assets --docs-root . --keep-database "$RUNNER_TEMP/tychonides.sqlite"
      - name: Check the study selections against the catalog
        run: |
          TYCHONIDES_CATALOG="$RUNNER_TEMP/tychonides.sqlite" python -m unittest tests.test_mars_study tests.test_refraction_study tests.test_parallax_study tests.test_predictions_study
