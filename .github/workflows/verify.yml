name: Verify code and catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: '3.11'
            os: ubuntu-24.04
          - python: '3.14'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m unittest discover -s tests
      - run: tychonides --help
      - name: Download versioned catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(jq -er '.release_id' resources/catalog/manifest.json)
          while IFS= read -r asset; do
            gh release download "$release_id" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/tychonides-assets
          done < <(jq -er '.output_hashes | keys[]' resources/catalog/manifest.json)
      - run: tychonides-verify resources/catalog --assets-dir /tmp/tychonides-assets --docs-root .
